<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyPilot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <h1>StudyPilot</h1>
  <ul>
    <li><button onclick="showSection('dashboard')">Dashboard</button></li>
    <li><button onclick="showSection('plan')">Studieplan</button></li>
    <li><button onclick="showSection('coach')">AI Coach</button></li>
    <li><button onclick="showSection('progress')">Progress</button></li>
    <li><button onclick="showSection('profile')">Profil</button></li>
  </ul>
</nav>

<main>
  <section id="dashboard" class="page active">
    <h2>Dashboard</h2>
    <p>Du har <span id="taskCount">0</span> uppgifter kvar idag.</p>
  </section>

  <section id="plan" class="page">
    <h2>Studieplan</h2>
    <input id="course" placeholder="Kurs">
    <input id="task" placeholder="Uppgift">
    <input id="deadline" type="date">
    <button class="primary" onclick="addTask()">Lägg till</button>

    <ul id="taskList"></ul>
  </section>

  <section id="coach" class="page">
    <h2>AI Coach</h2>
    <textarea id="coachInput" placeholder="Vad behöver du hjälp med?"></textarea>
    <button class="primary" onclick="coachReply()">Få tips</button>
    <p id="coachOutput"></p>
  </section>

  <section id="progress" class="page">
    <h2>Progress</h2>
    <p>Klara uppgifter: <span id="doneCount">0</span></p>
  </section>

  <section id="profile" class="page">
    <h2>Profil</h2>
    <input placeholder="Ditt namn">
    <input placeholder="Ditt mål">
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
